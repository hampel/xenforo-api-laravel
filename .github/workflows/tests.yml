name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix. Everything between
      # fails only when a corner does.
      #
      # One job per supported Laravel major, because a declared version that is never
      # resolved is an unbacked promise. The floor takes --prefer-lowest, which is the
      # only thing that ever resolves the dev toolchain low.
      #
      # Laravel 13 gets both ends of the PHP range: it runs on 8.3 through 8.5, so it
      # spans the range this package supports.
      matrix:
        include:
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0', deps: '--prefer-lowest' }
          - { php: '8.3', laravel: '^13.0', testbench: '^11.0', deps: '' }
          - { php: '8.5', laravel: '^13.0', testbench: '^11.0', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # --with, not `composer require`: it constrains within the declared range and
      # refuses to go outside it, so the matrix cannot drift away from composer.json
      # without the job failing. Every illuminate/* component is named, or Composer is
      # free to satisfy the unnamed ones from a different major. Testbench is pinned
      # alongside because its majors track Laravel's - Testbench 10 is Laravel 12,
      # Testbench 11 is Laravel 13 - and letting Composer choose would quietly test a
      # different Laravel than the job claims.
      - run: >
          composer update
          --with="illuminate/contracts:${{ matrix.laravel }}"
          --with="illuminate/http:${{ matrix.laravel }}"
          --with="illuminate/support:${{ matrix.laravel }}"
          --with="orchestra/testbench:${{ matrix.testbench }}"
          --prefer-dist --no-progress ${{ matrix.deps }}

      - run: vendor/bin/phpunit

      # Also here, not only in a job of its own: phpstan.neon covers the whole 8.3 - 8.5
      # PHP range in one pass wherever it runs, but its result still depends on the
      # dependency tree it resolved against - including larastan's view of whichever
      # Laravel was installed, which is the whole reason this job varies it.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          # Both are dev dependencies the install below deletes, and both have to run from
          # OUTSIDE the package's vendor tree. For the checker that is merely tidy; for
          # PHPStan it is load-bearing. Run in place, PHPStan picks up the autoloader
          # beside it, so every package that tree happens to have installed resolves in the
          # analysed code - and the check then passes on exactly the class it exists to
          # catch. setup-php installs both as standalone binaries on PATH, which satisfies
          # that by construction rather than by remembering to.
          tools: phpstan, composer-require-checker

      - run: composer install --no-dev --prefer-dist --no-progress

      # -c is not optional. Without it PHPStan discovers the package's own phpstan.neon,
      # which points at tests/ and includes larastan - neither of which survives --no-dev -
      # turning the run into a configuration error while you are trying to read it as a
      # dependency result.
      #
      # On a Laravel package this run is a supplement, not the primary check: laravel/framework
      # replaces every illuminate/* component, so the framework supplies every Illuminate
      # symbol whether its component was declared or not and nothing here looks wrong. The
      # checker below is what actually carries it.
      - run: >
          phpstan analyse
          -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

      # composer-require-checker maps each symbol back to the package that supplies it and
      # fails on anything outside "require". It also names an undeclared ext-*, which
      # nothing else catches. Run against the --no-dev tree above, because that is the
      # closure a consumer installs - though note the tree is not what makes it correct:
      # its known-symbol set comes from "require", so it reports a symbol supplied by a dev
      # dependency with that dependency still sitting in vendor/.
      #
      # The whitelist is not a way to silence findings. It holds five Illuminate symbols
      # that can never resolve, because laravel/framework "replace"s every illuminate/*
      # component - so Composer installs the framework and there is no vendor/illuminate/
      # for the checker to attribute them to. Verified on the --no-dev tree: vendor/laravel
      # exists, vendor/illuminate does not. A NEW Illuminate symbol appearing here is a
      # prompt to check its component is in "require", not to extend the list on sight;
      # each of these five was checked that way, and each maps to a component in "require".
      - run: >
          composer-require-checker check
          --config-file=.github/composer-require-checker.json
          composer.json

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
